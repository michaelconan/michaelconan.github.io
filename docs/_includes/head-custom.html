<!-- Favicon for page tab -->
<link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
<base target="_blank" />

<!-- Font Awesome import -->
<script
  src="https://kit.fontawesome.com/69124d6913.js"
  crossorigin="anonymous"
></script>

<!-- Google tag (gtag.js) -->
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}');
</script>

<!-- Navigation bar from _data/navigation.yml definition -->
<nav class="page-navigation" aria-label="Page navigation">
  <ul>
    {% for nav in site.data.content.navigation %} {% if nav.title == page.title
    or (nav.title == "Home" and page.url == "/") %}
    <li class="active">
      <a href="{{ nav.url }}" target="_top">{{ nav.title }}</a>
    </li>
    {% else %}
    <li>
      <a href="{{ site.url }}{{ nav.href }}" target="_top">{{ nav.title }}</a>
    </li>
    {% endif %} {% endfor %}
  </ul>
</nav>
