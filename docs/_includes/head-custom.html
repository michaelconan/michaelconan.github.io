<!-- Favicon for page tab -->
<link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
<base target="_blank" />

<!-- Font Awesome import -->
<script
  src="https://kit.fontawesome.com/69124d6913.js"
  crossorigin="anonymous"
></script>

<!-- Google tag (gtag.js) -->
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }

  // Initialize consent mode
  gtag('consent', 'default', {
    ad_storage: 'denied',
    analytics_storage: 'denied',
  });

  // Function to update consent
  function updateConsent(adConsent, analyticsConsent) {
    gtag('consent', 'update', {
      ad_storage: adConsent ? 'granted' : 'denied',
      analytics_storage: analyticsConsent ? 'granted' : 'denied',
    });
  }

  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}', { anonymize_ip: true });

  // Placeholder for user consent interaction
  document.addEventListener('DOMContentLoaded', function () {
    var consentBanner = document.getElementById('consent-banner');
    var acceptButton = document.getElementById('consent-accept');
    var rejectButton = document.getElementById('consent-reject');

    if (consentBanner) {
      acceptButton.addEventListener('click', function () {
        updateConsent(true, true);
        consentBanner.style.display = 'none';
      });

      rejectButton.addEventListener('click', function () {
        updateConsent(false, false);
        consentBanner.style.display = 'none';
      });
    }
  });
</script>

<!-- Navigation bar from _data/navigation.yml definition -->
<nav class="page-navigation" aria-label="Page navigation">
  <ul>
    {% for nav in site.data.content.navigation %} {% if nav.title == page.title
    or (nav.title == "Home" and page.url == "/") %}
    <li class="active">
      <a href="{{ nav.url }}" target="_top">{{ nav.title }}</a>
    </li>
    {% else %}
    <li>
      <a href="{{ site.url }}{{ nav.href }}" target="_top">{{ nav.title }}</a>
    </li>
    {% endif %} {% endfor %}
  </ul>
</nav>

<div id="consent-banner">
  <p>I use cookies to optimize my website.</p>
  <button id="consent-accept">Accept</button>
  <button id="consent-reject">Reject</button>
</div>
